<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte Ciudadano - Deán Funes</title>

  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS for Map rendering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* CSS Variables & Design Tokens */
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #10b981;
      --accent-hover: #059669;
      --maps-blue: #2563eb;
      --maps-blue-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.15), 0 8px 10px -6px rgba(15, 23, 42, 0.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Header Navbar Stylings */
    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: white;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #059669);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* Main App Layout */
    .app-container {
      display: flex;
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      flex: 1;
      height: 100%;
      z-index: 1;
    }

    /* Sidebar Stylings */
    .sidebar {
      width: 380px;
      background: var(--card-bg);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      z-index: 2;
      box-shadow: -4px 0 20px rgba(0, 0, 0, 0.05);
    }

    .sidebar-header {
      padding: 20px 20px 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h2 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
    }

    .issue-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Custom Scrollbar for Sidebar */
    .issue-list::-webkit-scrollbar {
      width: 6px;
    }

    .issue-list::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    .issue-list::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    .issue-list::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Issue Card Stylings */
    .issue-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    .issue-card:hover {
      border-color: #cbd5e1;
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .issue-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: white;
    }

    .severity-Alta { background-color: #ef4444; }
    .severity-Media { background-color: #f59e0b; }
    .severity-Baja { background-color: #3b82f6; }

    .issue-card-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .issue-card-desc {
      font-size: 0.85rem;
      color: #475569;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .issue-card-address {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .issue-card-footer {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
    }

    /* Modal Overlay & Card Stylings */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 92%;
      max-width: 520px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: var(--shadow-lg);
      position: relative;
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal {
      transform: scale(1);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-header h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .modal-close {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #e2e8f0;
      color: var(--primary);
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 0.82rem;
      color: #334155;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .form-group input[type="text"], 
    .form-group select, 
    .form-group textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      color: var(--text-main);
      background-color: #f8fafc;
      transition: all 0.2s;
    }

    .form-group input[type="text"]:focus, 
    .form-group select:focus, 
    .form-group textarea:focus {
      outline: none;
      border-color: #3b82f6;
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .camera-preview-container {
      margin-top: 10px;
      width: 100%;
      height: 180px;
      border: 2px dashed #cbd5e1;
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
      background-size: cover;
      background-position: center;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 500;
      transition: border-color 0.2s;
    }

    /* Custom Leaflet Markers */
    .custom-marker {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 18px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      border: 3px solid white;
      transition: transform 0.2s;
    }

    .custom-marker:hover {
      transform: scale(1.15);
    }

    .marker-bache { background: linear-gradient(135deg, #ef4444, #dc2626); }      
    .marker-alumbrado { background: linear-gradient(135deg, #f59e0b, #d97706); }  
    .marker-basura { background: linear-gradient(135deg, #10b981, #059669); }     
    .marker-agua { background: linear-gradient(135deg, #3b82f6, #2563eb); }       
    .marker-otros { background: linear-gradient(135deg, #8b5cf6, #7c3aed); }      

    /* Detail View Styling */
    .detail-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .vote-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-vote {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #f8fafc;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-confirm:hover {
      background-color: #ecfdf5;
      border-color: #10b981;
      color: #047857;
    }

    .btn-resolve:hover {
      background-color: #fff7ed;
      border-color: #f97316;
      color: #c2410c;
    }

    /* Botón Navegación a Google Maps */
    .btn-navigate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--maps-blue), #1d4ed8);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      margin-top: 16px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-navigate:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 42%;
      }
      #map {
        height: 58%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📍 Deán Funes - Reportes</h1>
    <button class="btn-primary" id="openReportModalBtn">
      ➕ Nuevo Reporte (GPS)
    </button>
  </header>

  <div class="app-container">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Incidencias Activas</h2>
      </div>
      <div class="issue-list" id="issueList">
        <!-- Rendered dynamically -->
      </div>
    </aside>
  </div>

  <!-- Modal: Report New Issue -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Reportar un Problema</h3>
        <button class="modal-close" id="closeReportModalBtn">&times;</button>
      </div>
      <form id="issueForm">
        <div class="form-group">
          <label>Ubicación (Calle, Número y Coordenadas)</label>
          <input type="text" id="locationInput" placeholder="Selecciona una ubicación..." readonly required>
          <input type="hidden" id="latInput">
          <input type="hidden" id="lngInput">
        </div>

        <div class="form-group">
          <label for="issueType">Tipo de Problema</label>
          <select id="issueType" required>
            <option value="bache">🛣️ Bache / Calzada</option>
            <option value="alumbrado">💡 Alumbrado Público</option>
            <option value="basura">🗑️ Basura / Acumulación</option>
            <option value="agua">💧 Fuga de Agua / Cloacas</option>
            <option value="otros">⚠️ Otros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="severity">Nivel de Gravedad</label>
          <select id="severity" required>
            <option value="Baja">Baja</option>
            <option value="Media" selected>Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Descripción breve</label>
          <textarea id="description" rows="3" placeholder="Describe el problema en detalle..." required></textarea>
        </div>

        <div class="form-group">
          <label>Fotografía obligatoria (Cámara o Galería)</label>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" required>
          <div class="camera-preview-container" id="cameraPreview">
            Sin imagen seleccionada
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">
          Publicar Reporte
        </button>
      </form>
    </div>
  </div>

  <!-- Modal: Issue Detail View -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detailTitle">Detalle de Incidencia</h3>
        <button class="modal-close" id="closeDetailModalBtn">&times;</button>
      </div>
      <div id="detailContent">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Configuración Inicial centrada en Deán Funes, Córdoba
    const DEAN_FUNES_COORDS = [-30.4208, -64.3497];
    
    // Categorías y Estilos
    const CATEGORIES = {
      bache: { label: 'Bache / Calzada', symbol: '🛣', class: 'marker-bache' },
      alumbrado: { label: 'Alumbrado Público', symbol: '💡', class: 'marker-alumbrado' },
      basura: { label: 'Basura', symbol: '🗑️', class: 'marker-basura' },
      agua: { label: 'Fuga de Agua', symbol: '💧', class: 'marker-agua' },
      otros: { label: 'Otros', symbol: '⚠️', class: 'marker-otros' }
    };

    // Estado Base de Datos (Simulación Local)
    let issues = [
      {
        id: 1,
        type: 'bache',
        severity: 'Alta',
        description: 'Bache profundo cerca de la Plaza San Martín. Dificulta el paso vehicular.',
        address: 'Plaza San Martín (-30.42150, -64.35020)',
        lat: -30.4215,
        lng: -64.3502,
        date: new Date(Date.now() - 3600000 * 4).toISOString(),
        confirmations: 3,
        goneReports: 0,
        image: 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 2,
        type: 'alumbrado',
        severity: 'Media',
        description: 'Luminaria apagada sobre Calle España. Zona muy oscura por la noche.',
        address: 'Calle España (-30.41920, -64.34750)',
        lat: -30.4192,
        lng: -64.3475,
        date: new Date(Date.now() - 3600000 * 18).toISOString(),
        confirmations: 1,
        goneReports: 0,
        image: 'https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=600&q=80'
      }
    ];

    let map;
    let markersMap = {};
    let selectedLatLng = null;
    let tempImageData = null;

    // FUNCIONALIDAD: Obtener nombre de la calle y número desde coordenadas (OpenStreetMap Geocoding)
    async function reverseGeocode(lat, lng) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`, {
          headers: { 'Accept-Language': 'es' }
        });
        if (!response.ok) throw new Error('Error en consulta de dirección');
        const data = await response.json();

        if (data && data.address) {
          const road = data.address.road || data.address.pedestrian || data.address.suburb || 'Calle sin nombre';
          const houseNumber = data.address.house_number ? ` ${data.address.house_number}` : '';
          return `${road}${houseNumber} (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
        }
      } catch (err) {
        console.warn("No se pudo obtener la calle exacta:", err);
      }
      return `Ubicación: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    // Inicializar Mapa
    function initMap() {
      map = L.map('map').setView(DEAN_FUNES_COORDS, 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors | Deán Funes'
      }).addTo(map);

      // Selección manual tocando el mapa
      map.on('click', async (e) => {
        selectedLatLng = e.latlng;
        document.getElementById('latInput').value = e.latlng.lat;
        document.getElementById('lngInput').value = e.latlng.lng;
        
        document.getElementById('locationInput').value = `📍 Buscando dirección... (${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)})`;
        openModal('reportModal');

        const fullAddress = await reverseGeocode(e.latlng.lat, e.latlng.lng);
        document.getElementById('locationInput').value = fullAddress;
      });

      refreshMapAndList();
    }

    // Refrescar mapa y feed lateral
    function refreshMapAndList() {
      const now = new Date();

      issues = issues.filter(issue => {
        const createdDate = new Date(issue.date);
        const hoursOld = (now - createdDate) / (1000 * 60 * 60);

        if (hoursOld > 24 && issue.confirmations === 0) return false;
        if (issue.goneReports > issue.confirmations) return false;
        return true;
      });

      Object.values(markersMap).forEach(marker => map.removeLayer(marker));
      markersMap = {};

      const listContainer = document.getElementById('issueList');
      listContainer.innerHTML = '';

      if (issues.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">No hay reportes activos en Deán Funes.</p>';
        return;
      }

      issues.forEach(issue => {
        const cat = CATEGORIES[issue.type] || CATEGORIES.otros;

        const customIcon = L.divIcon({
          className: '',
          html: `<div class="custom-marker ${cat.class}">${cat.symbol}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker([issue.lat, issue.lng], { icon: customIcon }).addTo(map);
        marker.on('click', () => openDetailModal(issue.id));
        markersMap[issue.id] = marker;

        const card = document.createElement('div');
        card.className = 'issue-card';
        card.onclick = () => {
          map.flyTo([issue.lat, issue.lng], 17);
          openDetailModal(issue.id);
        };

        const daradius: var(--radius-md);
      margin-bottom: 16px;
      box-shadow: var(--shadow-sm);
    }

    .vote-actions {
      display: flex;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-vote {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: #f8fafc;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.82rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-confirm:hover {
      background-color: #ecfdf5;
      border-color: #10b981;
      color: #047857;
    }

    .btn-resolve:hover {
      background-color: #fff7ed;
      border-color: #f97316;
      color: #c2410c;
    }

    /* Botón Navegación a Google Maps */
    .btn-navigate {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--maps-blue), #1d4ed8);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.92rem;
      text-decoration: none;
      margin-top: 16px;
      transition: all 0.2s;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
    }

    .btn-navigate:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(37, 99, 235, 0.45);
    }

    @media (max-width: 768px) {
      .app-container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 42%;
      }
      #map {
        height: 58%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>📍 Deán Funes - Reportes</h1>
    <button class="btn-primary" id="openReportModalBtn">
      ➕ Nuevo Reporte (GPS)
    </button>
  </header>

  <div class="app-container">
    <div id="map"></div>

    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Incidencias Activas</h2>
      </div>
      <div class="issue-list" id="issueList">
        <!-- Rendered dynamically -->
      </div>
    </aside>
  </div>

  <!-- Modal: Report New Issue -->
  <div class="modal-overlay" id="reportModal">
    <div class="modal">
      <div class="modal-header">
        <h3>Reportar un Problema</h3>
        <button class="modal-close" id="closeReportModalBtn">&times;</button>
      </div>
      <form id="issueForm">
        <div class="form-group">
          <label>Ubicación (Calle, Número y Coordenadas)</label>
          <input type="text" id="locationInput" placeholder="Selecciona una ubicación..." readonly required>
          <input type="hidden" id="latInput">
          <input type="hidden" id="lngInput">
        </div>

        <div class="form-group">
          <label for="issueType">Tipo de Problema</label>
          <select id="issueType" required>
            <option value="bache">🛣️ Bache / Calzada</option>
            <option value="alumbrado">💡 Alumbrado Público</option>
            <option value="basura">🗑️ Basura / Acumulación</option>
            <option value="agua">💧 Fuga de Agua / Cloacas</option>
            <option value="otros">⚠️ Otros</option>
          </select>
        </div>

        <div class="form-group">
          <label for="severity">Nivel de Gravedad</label>
          <select id="severity" required>
            <option value="Baja">Baja</option>
            <option value="Media" selected>Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Descripción breve</label>
          <textarea id="description" rows="3" placeholder="Describe el problema en detalle..." required></textarea>
        </div>

        <div class="form-group">
          <label>Fotografía obligatoria (Cámara o Galería)</label>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" required>
          <div class="camera-preview-container" id="cameraPreview">
            Sin imagen seleccionada
          </div>
        </div>

        <button type="submit" class="btn-primary" style="width:100%; justify-content:center;">
          Publicar Reporte
        </button>
      </form>
    </div>
  </div>

  <!-- Modal: Issue Detail View -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detailTitle">Detalle de Incidencia</h3>
        <button class="modal-close" id="closeDetailModalBtn">&times;</button>
      </div>
      <div id="detailContent">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Configuración Inicial centrada en Deán Funes, Córdoba
    const DEAN_FUNES_COORDS = [-30.4208, -64.3497];
    
    // Categorías y Estilos
    const CATEGORIES = {
      bache: { label: 'Bache / Calzada', symbol: '🛣', class: 'marker-bache' },
      alumbrado: { label: 'Alumbrado Público', symbol: '💡', class: 'marker-alumbrado' },
      basura: { label: 'Basura', symbol: '🗑️', class: 'marker-basura' },
      agua: { label: 'Fuga de Agua', symbol: '💧', class: 'marker-agua' },
      otros: { label: 'Otros', symbol: '⚠️', class: 'marker-otros' }
    };

    // Estado Base de Datos (Simulación Local)
    let issues = [
      {
        id: 1,
        type: 'bache',
        severity: 'Alta',
        description: 'Bache profundo cerca de la Plaza San Martín. Dificulta el paso vehicular.',
        address: 'Plaza San Martín (-30.42150, -64.35020)',
        lat: -30.4215,
        lng: -64.3502,
        date: new Date(Date.now() - 3600000 * 4).toISOString(),
        confirmations: 3,
        goneReports: 0,
        image: 'https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?auto=format&fit=crop&w=600&q=80'
      },
      {
        id: 2,
        type: 'alumbrado',
        severity: 'Media',
        description: 'Luminaria apagada sobre Calle España. Zona muy oscura por la noche.',
        address: 'Calle España (-30.41920, -64.34750)',
        lat: -30.4192,
        lng: -64.3475,
        date: new Date(Date.now() - 3600000 * 18).toISOString(),
        confirmations: 1,
        goneReports: 0,
        image: 'https://images.unsplash.com/photo-1509114397022-ed747cca3f65?auto=format&fit=crop&w=600&q=80'
      }
    ];

    let map;
    let markersMap = {};
    let selectedLatLng = null;
    let tempImageData = null;

    // FUNCIONALIDAD: Obtener nombre de la calle y número desde coordenadas (OpenStreetMap Geocoding)
    async function reverseGeocode(lat, lng) {
      try {
        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`, {
          headers: { 'Accept-Language': 'es' }
        });
        if (!response.ok) throw new Error('Error en consulta de dirección');
        const data = await response.json();

        if (data && data.address) {
          const road = data.address.road || data.address.pedestrian || data.address.suburb || 'Calle sin nombre';
          const houseNumber = data.address.house_number ? ` ${data.address.house_number}` : '';
          return `${road}${houseNumber} (${lat.toFixed(5)}, ${lng.toFixed(5)})`;
        }
      } catch (err) {
        console.warn("No se pudo obtener la calle exacta:", err);
      }
      return `Ubicación: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    // Inicializar Mapa
    function initMap() {
      map = L.map('map').setView(DEAN_FUNES_COORDS, 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors | Deán Funes'
      }).addTo(map);

      // Selección manual tocando el mapa
      map.on('click', async (e) => {
        selectedLatLng = e.latlng;
        document.getElementById('latInput').value = e.latlng.lat;
        document.getElementById('lngInput').value = e.latlng.lng;
        
        document.getElementById('locationInput').value = `📍 Buscando dirección... (${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)})`;
        openModal('reportModal');

        const fullAddress = await reverseGeocode(e.latlng.lat, e.latlng.lng);
        document.getElementById('locationInput').value = fullAddress;
      });

      refreshMapAndList();
    }

    // Refrescar mapa y feed lateral
    function refreshMapAndList() {
      const now = new Date();

      issues = issues.filter(issue => {
        const createdDate = new Date(issue.date);
        const hoursOld = (now - createdDate) / (1000 * 60 * 60);

        if (hoursOld > 24 && issue.confirmations === 0) return false;
        if (issue.goneReports > issue.confirmations) return false;
        return true;
      });

      Object.values(markersMap).forEach(marker => map.removeLayer(marker));
      markersMap = {};

      const listContainer = document.getElementById('issueList');
      listContainer.innerHTML = '';

      if (issues.length === 0) {
        listContainer.innerHTML = '<p style="text-align:center; color:#888; margin-top:20px;">No hay reportes activos en Deán Funes.</p>';
        return;
      }

      issues.forEach(issue => {
        const cat = CATEGORIES[issue.type] || CATEGORIES.otros;

        const customIcon = L.divIcon({
          className: '',
          html: `<div class="custom-marker ${cat.class}">${cat.symbol}</div>`,
          iconSize: [36, 36],
          iconAnchor: [18, 18]
        });

        const marker = L.marker([issue.lat, issue.lng], { icon: customIcon }).addTo(map);
        marker.on('click', () => openDetailModal(issue.id));
        markersMap[issue.id] = marker;

        const card = document.createElement('div');
        card.className = 'issue-card';
        card.onclick = () => {
          map.flyTo([issue.lat, issue.lng], 17);
          openDetailModal(issue.id);
        };

        const dateStr = new Date(issue.date).toLocaleDateString('es-AR', {
          hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short'
        });

        card.innerHTML = `
          <div class="issue-card-header">
            <span class="issue-card-title">${cat.symbol} ${cat.label}</span>
            <span class="badge severity-${issue.severity}">${issue.severity}</span>
          </div>
          <p class="issue-card-desc">${escapeHtml(issue.description)}</p>
          <p class="issue-card-address">📍 ${escapeHtml(issue.address || '')}</p>
          <div class="issue-card-footer">
            <span>📅 ${dateStr}</span>
            <span>👍 ${issue.confirmations} | 👎 ${issue.goneReports}</span>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Controles de Modales
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    // Previsualización de Imagen
    document.getElementById('cameraInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          tempImageData = evt.target.result;
          const preview = document.getElementById('cameraPreview');
          preview.style.backgroundImage = `url(${tempImageData})`;
          preview.textContent = '';
        };
        reader.readAsDataURL(file);
      }
    });

    // Envío del Formulario
    document.getElementById('issueForm').addEventListener('submit', function(e) {
      e.preventDefault();

      if (!tempImageData) {
        alert('❌ Error: Es obligatorio adjuntar una fotografía del problema.');
        return;
      }

      const lat = parseFloat(document.getElementById('latInput').value);
      const lng = parseFloat(document.getElementById('lngInput').value);
      const address = document.getElementById('locationInput').value;

      if (isNaN(lat) || isNaN(lng)) {
        alert('❌ Error: Faltan las coordenadas. Por favor usa el botón de GPS o haz clic directamente en el mapa.');
        return;
      }

      const newIssue = {
        id: Date.now(),
        type: document.getElementById('issueType').value,
        severity: document.getElementById('severity').value,
        description: document.getElementById('description').value,
        address: address,
        lat: lat,
        lng: lng,
        date: new Date().toISOString(),
        confirmations: 1, 
        goneReports: 0,
        image: tempImageData
      };

      issues.unshift(newIssue);
      refreshMapAndList();

      alert('✅ ¡Reporte publicado con éxito!\n\nEl problema y su dirección exacta son visibles en el mapa para los demás ciudadanos.');

      this.reset();
      tempImageData = null;
      document.getElementById('cameraPreview').style.backgroundImage = 'none';
      document.getElementById('cameraPreview').textContent = 'Sin imagen seleccionada';
      closeModal('reportModal');
      
      map.flyTo([lat, lng], 17);
    });

    // Modal de Detalles con Botón de Navegación "Llegar allí"
    function openDetailModal(issueId) {
      const issue = issues.find(i => i.id === issueId);
      if (!issue) return;

      const cat = CATEGORIES[issue.type] || CATEGORIES.otros;
      const dateFormatted = new Date(issue.date).toLocaleString('es-AR');

      document.getElementById('detailTitle').innerText = `${cat.symbol} ${cat.label}`;
      
      const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${issue.lat},${issue.lng}`;

      const content = document.getElementById('detailContent');
      content.innerHTML = `
        <img src="${issue.image}" class="detail-img" alt="Foto de la incidencia">
        <p><strong>Ubicación:</strong> ${escapeHtml(issue.address || '')}</p>
        <p style="margin-top:6px;"><strong>Gravedad:</strong> <span class="badge severity-${issue.severity}">${issue.severity}</span></p>
        <p style="margin-top:6px;"><strong>Fecha:</strong> ${dateFormatted}</p>
        <p style="margin-top:8px;"><strong>Descripción:</strong></p>
        <p style="color:#555; font-size:0.9rem; margin-top:4px;">${escapeHtml(issue.description)}</p>
        
        <a href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer" class="btn-navigate">
          🗺️ Llegar allí (Abrir en Google Maps)
        </a>

        <div style="margin-top:14px; font-size:0.85rem; color:#666;">
          <strong>Estado actual:</strong> ${issue.confirmations} confirmaciones / ${issue.goneReports} reportes de solución
        </div>

        <div class="vote-actions">
          <button class="btn-vote btn-confirm" onclick="voteIssue(${issue.id}, 'confirm')">
            👍 Confirmar que persiste
          </button>
          <button class="btn-vote btn-resolve" onclick="voteIssue(${issue.id}, 'resolve')">
            👎 Reportar que ya no está
          </button>
        </div>
      `;

      openModal('detailModal');
    }

    // Lógica de Votaciones
    window.voteIssue = function(id, action) {
      const issue = issues.find(i => i.id === id);
      if (!issue) return;

      if (action === 'confirm') issue.confirmations += 1;
      else if (action === 'resolve') issue.goneReports += 1;

      closeModal('detailModal');
      refreshMapAndList();
    };

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Botón GPS Mejorado con Lectura de Calle + Coordenadas
    document.getElementById('openReportModalBtn').onclick = () => {
      const btn = document.getElementById('openReportModalBtn');
      const originalText = btn.innerHTML;
      
      btn.innerHTML = '⏳ Localizando GPS...';
      btn.disabled = true;

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          async (position) => {
            btn.innerHTML = originalText;
            btn.disabled = false;

            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            selectedLatLng = { lat, lng };

            document.getElementById('latInput').value = lat;
            document.getElementById('lngInput').value = lng;
            document.getElementById('locationInput').value = `📍 Buscando dirección... (${lat.toFixed(5)}, ${lat.toFixed(5)})`;

            map.flyTo([lat, lng], 17);
            openModal('reportModal');

            const fullAddress = await reverseGeocode(lat, lng);
            document.getElementById('locationInput').value = fullAddress;
          },
          (error) => {
            btn.innerHTML = originalText;
            btn.disabled = false;
            
            let motivo = "";
            switch(error.code) {
              case error.PERMISSION_DENIED:
                motivo = "Rechazaste el permiso de ubicación.";
                break;
              case error.POSITION_UNAVAILABLE:
                motivo = "La señal de ubicación no está disponible en este momento.";
                break;
              case error.TIMEOUT:
                motivo = "Se agotó el tiempo de espera buscando los satélites.";
                break;
              default:
                motivo = "Ocurrió un error desconocido.";
                break;
            }
            
            alert(`⚠️ No pudimos usar tu GPS automático.\nMotivo: ${motivo}\n\nPor favor, ubica el problema tocando directamente un lugar en el mapa.`);
          },
          { 
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
          }
        );
      } else {
        btn.innerHTML = originalText;
        btn.disabled = false;
        alert("⚠️ Tu dispositivo no soporta GPS. Por favor, toca directamente sobre el mapa para ubicar el reporte.");
      }
    };

    document.getElementById('closeReportModalBtn').onclick = () => closeModal('reportModal');
    document.getElementById('closeDetailModalBtn').onclick = () => closeModal('detailModal');

    // Iniciar aplicación
    window.onload = initMap;
  </script>
</body>
</html>
